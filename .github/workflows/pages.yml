name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site/reports

          # Generate index page
          cat > _site/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Finding Growth Stocks</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292f; max-width: 960px; margin: 0 auto; padding: 2rem 1rem; background: #fff; }
              h1 { font-size: 1.8rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
              h2 { font-size: 1.3rem; margin: 1.5rem 0 0.8rem; color: #1f2328; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
              .report-list { list-style: none; }
              .report-list li { padding: 0.5rem 0; border-bottom: 1px solid #d0d7de; }
              .report-list li:last-child { border-bottom: none; }
              .ticker { font-weight: 600; font-family: monospace; }
              .date { color: #656d76; font-size: 0.9rem; }
              footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #d0d7de; color: #656d76; font-size: 0.85rem; }
            </style>
          </head>
          <body>
            <h1>Finding Growth Stocks</h1>
            <p>AI-assisted multi-agent trading analysis reports.</p>
          HTMLEOF

          # Group reports by stock
          prev_stock=""
          first_group=true
          for dir in reports/*/; do
            [ -d "$dir" ] || continue
            stock=$(basename "$dir")
            if [ "$stock" != "$prev_stock" ]; then
              if [ "$first_group" = false ]; then
                echo "</ul>" >> _site/index.html
              fi
              echo "<h2>${stock}</h2>" >> _site/index.html
              echo "<ul class=\"report-list\">" >> _site/index.html
              first_group=false
              prev_stock="$stock"
            fi
            for f in "$dir"*.md; do
              [ -f "$f" ] || continue
              fname=$(basename "$f" .md)
              title=$(head -1 "$f" | sed 's/^# //')
              echo "<li><a href=\"reports/${stock}/${fname}.html\">${title}</a></li>" >> _site/index.html
              # Convert markdown to HTML fragment
              mkdir -p "_site/reports/${stock}"
              {
                echo '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">'
                echo "<title>${title}</title>"
                echo '<style>* { margin: 0; padding: 0; box-sizing: border-box; } body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292f; max-width: 960px; margin: 0 auto; padding: 2rem 1rem; } table { border-collapse: collapse; width: 100%; margin: 1rem 0; } th, td { border: 1px solid #d0d7de; padding: 0.5rem 0.75rem; text-align: left; } th { background: #f6f8fa; font-weight: 600; } tr:nth-child(even) { background: #f6f8fa; } h1 { font-size: 1.6rem; border-bottom: 1px solid #d0d7de; padding-bottom: 0.5rem; margin: 1.5rem 0 1rem; } h2 { font-size: 1.3rem; margin: 1.5rem 0 0.8rem; } h3 { font-size: 1.1rem; margin: 1.2rem 0 0.6rem; } blockquote { border-left: 3px solid #d0d7de; padding-left: 1rem; color: #656d76; margin: 1rem 0; } code { background: #f6f8fa; padding: 0.15rem 0.3rem; border-radius: 3px; font-size: 0.9em; } a { color: #0969da; text-decoration: none; } a:hover { text-decoration: underline; } hr { border: none; border-top: 1px solid #d0d7de; margin: 1.5rem 0; } em { color: #656d76; } .nav { margin-bottom: 1.5rem; } .nav a { font-size: 0.9rem; }</style>'
                echo '</head><body>'
                echo '<div class="nav"><a href="../../index.html">&larr; Back to index</a></div>'
              } > "_site/reports/${stock}/${fname}.html"

              # Simple markdown conversion
              sed -E \
                -e 's/^### (.*)/<h3>\1<\/h3>/' \
                -e 's/^## (.*)/<h2>\1<\/h2>/' \
                -e 's/^# (.*)/<h1>\1<\/h1>/' \
                -e 's/^\*\*(.*)\*\*$/<strong>\1<\/strong>/' \
                -e 's/^\> (.*)/<blockquote>\1<\/blockquote>/' \
                -e 's/^- (.*)/<li>\1<\/li>/' \
                -e 's/\*\*(.+?)\*\*/<strong>\1<\/strong>/g' \
                -e 's/\*(.+?)\*/<em>\1<\/em>/g' \
                -e 's/`(.+?)`/<code>\1<\/code>/g' \
                -e 's/\[(.+?)\]\((.+?)\)/<a href="\2">\1<\/a>/g' \
                -e 's/^---$/<hr>/' \
                -e 's/^$/<br>/' \
                "$f" >> "_site/reports/${stock}/${fname}.html"

              echo '</body></html>' >> "_site/reports/${stock}/${fname}.html"
            done
          done
          if [ "$first_group" = false ]; then
            echo "</ul>" >> _site/index.html
          fi

          # Footer
          cat >> _site/index.html << 'HTMLEOF'
            <footer>
              <p>Generated by TradingAgents framework. For research purposes only, not investment advice.</p>
              <p><a href="https://github.com/TauricResearch/TradingAgents">TradingAgents</a> | <a href="https://github.com/panhaoneo/FindingGrowthStocks">GitHub</a></p>
            </footer>
          </body>
          </html>
          HTMLEOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
